### general parameters defining the ocp
model_name: 'karl'                # name of the acados model (also used in ROS node)
model_type: 'Ackermann'           # model type on which the acados model is based on (Ackermann or RWS)
optimization_horizon: 5.0         # optimization horizon [s] (also used in ROS node)
n_shots: 50                       # number of shooting intervals in optimization horizon (also used in ROS node)

### vehicle specific parameters
wheelbase: 3.124                  # wheelbase [m]
length: 5.173                     # length [m]
width: 1.94                       # width [m]
offset2geocenter: [1.4895, 0.0]   # [long (x),lat (y)] distance from vehicle-frame to geometric center [m]

### constraints
delta_max: 0.5434955291           # max. absolute steering angle [rad] (31.14°)
v_min: -0.01                      # lower boundary constraint for longitudinal velocity [m/s]
v_max: 20.84                      # upper boundary constraint for longitudinal velocity [m/s] (75km/h)
acceleration_max: 9.81            # max. absolute acceleration [m/s²]
acceleration_t_min: -4.5          # max. negative tangential acceleration [m/s²]
acceleration_t_max: 2.0           # max. positive tangential acceleration [m/s²]
acceleration_n_max: 3.0           # max. absolute normal acceleration [m/s²]
alpha_max: 0.7330382858           # max. absolute steering rate [rad/s] (42°/s)
jerk_min: -5.0                    # max. negative tangential jerk [m/s²]
jerk_max: 2.0                     # max. positive tangential jerk [m/s²]

### cost scaling factors
c_lat: 0.5            # distance to scale the lateral deviation costs [m]
c_psi: 1.0            # distance to scale the yaw deviation costs [rad] -> not used cost function
c_x: 1.0              # distance to scale the x deviation costs [m]
c_y: 1.0              # distance to scale the y deviaton costs [m]
c_a_t: 3.0            # distance to scale the tangential acceleration costs [m/s²]
c_a_n: 3.0            # distance to scale the nominal acceleration costs [m/s²]
c_j_t: 3.0            # distance to scale the tangential jerk costs [m/s³]
c_j_n: 3.0            # distance to scale the normal jerk costs [m/s³]
c_alpha: 0.35         # distance to scale the steering rate costs [rad/s]

### slack weights for soft constraints
enable_boundary_slack: False                # activate slack weights for soft constraints (route boundaries)
boundary_slack_weights:                     # scalar or list (length 2)
  linear_lower: 10.0
  linear_upper: 10.0
  quadratic_lower: 100.0
  quadratic_upper: 100.0
enable_object_slack: False                  # activate slack weights for object constraints
object_slack_weights:                       # scalar or list (length n_objects)
  linear_lower: 50.0
  linear_upper: 50.0
  quadratic_lower: 500.0
  quadratic_upper: 500.0

### parameter vector structure (stage-wise parameters)
# [dyn_weight (1), constraint_activation (2), objects]
p_dynamic_weight_shape: [1, 1]    # one value (also used in ROS node)
p_constraint_activation_shape: [2, 1] # stage-wise [objects, boundaries] flags for sparse solve-phase toggling
p_objects_shape: [30, 6]          # nObjects x [x, y, yaw, half_length, half_width, active]
obb_smoothing_epsilon: 0.001      # smooth absolute-value bound [m]
obb_smoothing_tau: 0.02           # conservative smooth maximum scale [m]
obb_positive_margin_scale: 0.5    # sign-preserving saturation scale for already separated OBBs [m]

### global parameter vector structure (constant over the horizon)
# [cost_weights (12), cost_params (4), ref_path]
p_cost_weights_shape: [12, 1]     # nWeights x weightDim (also used in ROS node)
p_cost_params_shape: [4, 1]       # [thw, d_min_object_long, d_min_object_lat, d_min_boundary_lat] x nCostParamsDim (also used in ROS node)
p_ref_path_shape: [51, 6]         # nStates x [psi, x, y, v, d_bound_left, d_bound_right] (also used in ROS node)
