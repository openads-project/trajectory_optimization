### general parameters defining the ocp
model_name: 'shuttle'             # name of the acados model (also used in ROS node)
model_type: 'RWS'                 # model type on which the acados model is based on (Ackermann or RWS)
optimization_horizon: 5.0         # optimization horizon [s] (also used in ROS node)
n_shots: 50                       # number of shooting intervals in optimization horizon (also used in ROS node)

### vehicle specific parameters
distance_cg_front_axle: 1.7       # distance from center of gravity to front axle [m] TODO: VALUE
distance_cg_rear_axle: 1.7        # distance from center of gravity to rear axle [m]  TODO: VALUE
length: 4.97                      # length [m]
width: 2.12                       # width [m]
offset2geocenter: [0.0, 0.0]      # [long (x),lat (y)] distance from vehicle-frame to geometric center [m]

### constraints
delta_max: 1.55 # 89°             # max. absolute steering angle [rad]
beta_max: 0.349  # 20°            # max. absolute side slip angle [rad]
alpha_max: 1.5                    # max. absolute steering rate of the wheels [rad/s]
psi_dot_max: 0.5                  # max. absolute turning rate of the vehicle [rad/s]
v_min: 0.0                        # lower boundary constraint for longitudinal/lateral velocity [m/s]
v_max: 7.0                        # upper boundary constraint for longitudinal/lateral velocity [m/s]
acceleration_max: 8.0             # max. absolute acceleration [m/s²]
acceleration_t_min: -3.5          # max. negative tangential acceleration [m/s²]
acceleration_t_max: 3.5           # max. positive tangential acceleration [m/s²]
acceleration_n_max: 8.0           # max. absolute normal acceleration [m/s²]
jerk_min: -4.0                    # max. negative tangential jerk [m/s²]
jerk_max: 4.0                     # max. positive tangential jerk [m/s³]
# constraint on front and rear steering angle
# none (default): no constraint, ICR (instantaneous center of rotation) is free to move
# anti-phase: ICR is restricted to the y-axis in the vehicles center of gravity frame -> achieves minimum turning radius
# in-phase: ICR lies in infinity -> vehicle is not able to turn, but can move sideways -> vehicle slip angle (beta) is equal to the path gradient
steering_mode_constraint: 'none'  # steering mode of the vehicle (in-phase, anti-phase or none (default))

### cost scaling factors
c_lat: 0.5            # distance to scale the lateral deviation costs [m]
c_psi: 0.3            # distance to scale the yaw deviation costs [rad]
c_x: 1.0              # distance to scale the x deviation costs [m]
c_y: 1.0              # distance to scale the y deviaton costs [m]
c_a_t: 3.0            # distance to scale the tangential acceleration costs [m/s²]
c_a_n: 3.0            # distance to scale the nominal acceleration costs [m/s²]
c_j_t: 3.0         # distance to scale the tangential jerk costs [m/s³]
c_j_n: 3.0         # distance to scale the normal jerk costs [m/s³]
c_alpha: 0.15         # distance to scale the steering rate costs [rad/s]

### slack weights for soft constraints
enable_boundary_slack: False                # activate slack weights for soft constraints (route boundaries)
boundary_slack_weights:                     # scalar or list (length 2)
  linear_lower: 10.0
  linear_upper: 10.0
  quadratic_lower: 100.0
  quadratic_upper: 100.0
enable_obstacle_slack: False                # activate slack weights for obstacle constraints
obstacle_slack_weights:                     # scalar or list (length n_obstacles)
  linear_lower: 50.0
  linear_upper: 50.0
  quadratic_lower: 500.0
  quadratic_upper: 500.0

### parameter vector structure (stage-wise parameters)
# [dyn_weight (1), obstacles]
p_dynamic_weight_shape: [1, 1]    # one value (also used in ROS node)
p_obstacle_obbs_shape: [30, 6]    # nObstacleOBBs x [x, y, yaw, half_length, half_width, active]
obb_smoothing_epsilon: 0.001      # smooth absolute-value bound [m]
obb_smoothing_tau: 0.02           # conservative smooth maximum scale [m]
obb_positive_margin_scale: 0.5    # sign-preserving saturation scale for already separated OBBs [m]

### global parameter vector structure (constant over the horizon)
# [cost_weights (12), cost_params (4), ref_path]
p_cost_weights_shape: [12, 1]     # nWeights x weightDim (also used in ROS node)
p_cost_params_shape: [4, 1]       # [thw, d_min_obstacle_long, d_min_obstacle_lat, d_min_boundary_lat] x nCostParamsDim (also used in ROS node)
p_ref_path_shape: [51, 6]         # nStates x [psi, x, y, v, d_bound_left, d_bound_right] (also used in ROS node)
