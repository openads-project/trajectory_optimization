/**:
  ros__parameters:
    ### ROS node parameters
    vehicle_frame_id: base_link     # Frame ID of local vehicle frame (the ocp is defined in this frame) //TODO: is base_link in gravity center?
    trajectory_frame_id: base_link  # Frame ID of output trajectory
    fixed_over_time_frame_id: map   # Frame ID of frame that is fixed over time for finding temporal transforms
    optimization_frequency: 10.0    # frequency of the optimization loop [Hz]/ defines how often the optimization problem is solved
    init_as_ref: False              # initialize ocp solution using reference trajectory when no valid last solution is available (e.g. standstill situation)
    standstill_threshold: 0.3       # threshold for standstill detection [m/s]. If all state velocities are below this threshold, publish standstill trajectory
    high_level_stabilization: False # init first trajectory point with: current EgoData (True); interpolation of last trajectory -> bi-level (False)
    use_prediction: True            # use obstacle predictions for optimization (True) or only static obstacles (False)
    verbose: False                  # print debug infromation and solver statistics
    debug_visualization: True       # publish debug visualization markers (e.g. obstacle circles)

    #### thresholds for bi-level stabilization TODO: adapt the bi-level values
    bi_level_dV: 5.0                # maximum v difference before bi-level stabilization hits [m/s]
    bi_level_dA: 2.0                # maximum a difference before bi-level stabilization hits [m/s²]
    bi_level_dY: 0.5                # maximum y-offset before bi-level stabilization hits [m]
    bi_level_dYaw: 6.0              # maximum yaw difference before bi-level stabilization hits [degree]
    bi_level_dDelta_front: 5.0       # maximum front steering difference before bi-level stabilization hits [degree]
    bi_level_dDelta_rear: 5.0        # maximum rear steering difference before bi-level stabilization hits [degree]

    ### general parameters defining the ocp
    model_name: 'omni_shuttle'        # name of the acados model
    optimization_horizon: 5.0         # optimization horizon [s] (also used as build parameter in OCP)
    n_shots: 50                       # number of shooting intervals in optimization horizon (also used as build parameter in OCP)

    #### vehicle specific parameters
    distance_front_axle: 1.7         # distance from center of gravity to front axle [m]
    distance_rear_axle: 1.7          # distance from center of gravity to rear axle [m]

    
    #### cost weights
    cost_weights:
      - 5.0  # dlat (0)
      - 1.0  # psi (1)
      - 0.0  # x (2)
      - 0.0  # y (3)
      - 3.0  # v_t (4)
      - 10.0  # obstacles (5)
      - 0.1 # a_n (6)
      - 0.5  # a_t_pos (7)
      - 0.5 # a_t_neg (8)
      - 0.05  # j_n (9)
      - 0.1  # j_t_pos (10)
      - 0.05 # j_t_neg (11)
      - 0.1  # alpha_f/alpha_r (12)
      - 1.0  # endYaw (13)
    dynamic_weight: 1.0

    # other cost params
    thw: 2.0                    # time headway [s]
    d_min_obstacle_long: 5.0    # minimum distance to keep to obstacles in longitudinal direction [m]
    d_min_obstacle_lat: 0.5     # minimum distance to keep to obstacles in lateral direction [m]