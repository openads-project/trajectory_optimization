/**:
  ros__parameters:
    ### ROS node parameters
    vehicle_frame_id: base_link     # Frame ID of local vehicle frame (the ocp is defined in this frame)
    trajectory_frame_id: base_link  # Frame ID of output trajectory
    fixed_over_time_frame_id: map   # Frame ID of frame that is fixed over time for finding temporal transforms
    optimization_frequency: 10.0    # frequency of the optimization loop [Hz]
    init_as_ref: False              # initialize ocp solution using reference trajectory when no valid last solution is available (e.g. standstill situation)
    standstill_threshold: 0.3       # threshold for standstill detection [m/s]. If all state velocities are below this threshold, publish standstill trajectory
    high_level_stabilization: False # init first trajectory point with: current EgoData (True); interpolation of last trajectory -> bi-level (False)
    add_x_init_to_ref: False        # add initial state of OCP to beginning of reference trajectory if this starts in front of ego vehicle
    use_prediction: True            # use obstacle predictions for optimization (True) or only static obstacles (False)
    verbose: False                  # print debug infromation and solver statistics
    debug_visualization: True       # publish debug visualization markers (e.g. obstacle circles)
    run_as_callback: False          # run OCP once for each received reference trajectory (true) or on a timer (false)

    #### thresholds for bi-level stabilization
    bi_level_dV: 5.0                # maximum v difference before bi-level stabilization hits [m/s]
    bi_level_dA: 2.0                # maximum a difference before bi-level stabilization hits [m/s²]
    bi_level_dY: 0.2                # maximum y-offset before bi-level stabilization hits [m]
    bi_level_dYaw: 6.0              # maximum yaw difference before bi-level stabilization hits [degree]
    bi_level_dDelta: 5.0            # maximum ackermann delta difference before bi-level stabilization hits [degree]

    ### general parameters defining the ocp
    model_name: 'karl'              # name of the acados model
    optimization_horizon: 8.0       # optimization horizon [s] (also used as build parameter in OCP)
    n_shots: 16                     # number of shooting intervals in optimization horizon (also used as build parameter in OCP)

    #### cost weights
    cost_weights:
      - 0.3  # dlat (0)
      - 0.0  # psi (1)      (considered if RWS model is used)
      - 0.15 # v_inter (2)
      - 0.0  # obstacles (3)
      - 0.2  # a_lat (4)
      - 0.2  # a_lon_pos (5)
      - 0.05 # a_lon_neg (6)
      - 0.1  # j_lat (7)
      - 0.1  # j_lon_pos (8)
      - 0.05 # j_lon_neg (9)
      - 0.03 # alpha (10)
      - 1.0  # endYaw (11)
    dynamic_weight: 1.0         # base for exponential weight

    # other cost params
    thw: 2.0                    # time headway [s]
    d_min_obstacle_long: 5.0    # minimum distance to keep to obstacles in longitudinal direction [m]
    d_min_obstacle_lat: 0.1     # minimum distance to keep to obstacles in lateral direction [m]
    d_min_boundary_lat: 0.0     # minimum distance to keep to boundaries in lateral direction [m]