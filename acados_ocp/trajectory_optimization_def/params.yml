#### general parameters defining the mpc
model_name: 'trajectory_planning'
horizon: 5.0                      # optimization horizon [s]
nsteps: 50                        # number of shooting intervals in optimization horizon

#### vehicle specific parameters
wheelbase: 2.711                  # wheelbase [m]
length: 4.799                     # length [m]
width: 1.855                      # width [m]
delta_max: 0.4956735              # max. absolute steering angle [rad]
v_min: 0.0                        # lower boundary constraint for longitudinal velocity [m/s]
v_max: 30.0                       # upper boundary constraint for longitudinal velocity [m/s]
acceleration_max: 9.0             # max. absolute acceleration [m/s²]
acceleration_lon_max: 3.5         # max. absolute longitudinal acceleration [m/s²]
alpha_max: 0.5                    # max. absolute steering rate [rad/s]
jerk_max: 4.0                     # max. absolute longitudinal jerk [m/s²]

#### other parameters